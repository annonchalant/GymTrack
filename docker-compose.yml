services:

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Not exposed externally — only reachable by backend on the internal network

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-gym_track}
    ports:
      - "8000:8000"   # Keep open if you want direct API access; remove for tighter security

  frontend:
    build:
      context: ./frontend
      args:
        # Passed at build time so Expo bakes the URL into the JS bundle.
        # On EC2: set EC2_PUBLIC_IP in .env or export it before running docker-compose.
        EXPO_PUBLIC_API_URL: http://${EC2_PUBLIC_IP:-localhost}:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mongo_data:
